# pre-commit gate for adrcheck.
#
#   uvx pre-commit install            install the hooks (an uninstalled hook is not a gate)
#   uvx pre-commit run --all-files    first run, or after editing this file
#
# Lifted from cartography-aws-mapper (shape, beads excludes, markdownlint, commit-msg hook)
# and claude-skills (bandit gate), both Kevin's. Pins are the release tags current on
# 2026-11-06, read from each repository, not assumed.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Files generated and regenerated by `bd init` / `bd setup`; not ours to lint or reformat.
exclude: '^(\.beads/|\.agents/|\.claude/|\.codex/|\.cursor/|AGENTS\.md$|CLAUDE\.md$|uv\.lock$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^docs/img/demo\.gif$  # the README recording, about 1 MB, rendered from docs/demo/adrcheck.tape
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # Secret scanner over staged changes. adrcheck may go public and its docs name
  # provider credential variables; a real key committed as an example is the failure
  # this guards. It scans the staged diff only; history is a different question.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lint and format from [tool.ruff] in pyproject.toml, so the hook and a bare
  # `ruff check` cannot disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Security lint for the Python sources, configured in [tool.bandit]. The subprocess
  # calls in the adapters are the design (git, claude) and carry per-line nosec with a
  # reason rather than a global skip.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      # Conventional Commit subject; rejects AI attribution and session-link trailers.
      - id: no-ai-attribution
        name: conventional commit, no AI attribution
        entry: scripts/hooks/check-commit-msg.sh
        language: system
        stages: [commit-msg]
      # The suite runs in under five seconds. Two commits on 2026-11-08 carried a failing
      # test past a lint-only gate; this is the cheapest fix, and CI still runs the matrix.
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
