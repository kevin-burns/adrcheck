# adrcheck checks adrcheck: every pull request is judged against the ADRs under docs/adr using the action in
# this very repository. The first consumer of the Action is the repository that ships it (bead adrcheck-dzz).
# Judge: Haiku 5.5 through OpenRouter, the cheapest judge measured that matched Sonnet on both public
# corpora (docs/providers.md). Needs the repository secret OPENAI_API_KEY (an OpenRouter key, ideally one
# with a credit limit) and the repository variable OPENAI_BASE_URL. Without them the step reports "could
# not evaluate" (exit 3) as a warning and does not fail, so a fork's pull request still runs the rest of
# CI. max-calls bounds a long pull request to ten judge calls.
name: adrcheck

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  self-check:
    name: adrcheck on this pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check this pull request against docs/adr
        uses: ./
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          adr-dir: docs/adr
          model: openai:anthropic/claude-haiku-5.5
          max-calls: "10"
