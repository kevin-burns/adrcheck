[project]
name = "adrcheck"
version = "0.1.0"
description = "Checks code changes against architecture decision records, both directions, and publishes its false-alarm rate"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "KevinB", email = "79973117+kevin-burns@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
adrcheck = "adrcheck.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and embed ADR and diff fixtures whose lines are not wrapped.
"tests/*" = ["S101", "E501", "S603", "S607"]
# The compile and judge prompts carry one-line JSON shape examples; wrapping them changes the prompt.
"src/adrcheck/adapters/claude_judge.py" = ["E501", "S603", "S607"]
# argv lists, no shell, fixed executables (git, claude) resolved from PATH on purpose.
"src/adrcheck/adapters/git_changes.py" = ["S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
