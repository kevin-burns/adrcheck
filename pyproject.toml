[project]
name = "adrcheck"
version = "0.1.0"
description = "Checks code changes against architecture decision records, both directions, and publishes its false-alarm rate"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "KevinB", email = "79973117+kevin-burns@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
adrcheck = "adrcheck.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
